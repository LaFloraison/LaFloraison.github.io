<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<title>DL Math · 课程阅读器</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg-primary:#1e1e1e;--bg-secondary:#181818;--bg-surface:#252525;--bg-hover:#2d2d2d;
  --bg-code:#1a1a2e;--color-accent:#0284c7;--color-accent-light:#38bdf8;
  --color-accent-soft:rgba(2,132,199,0.15);--color-accent-glow:rgba(2,132,199,0.08);
  --color-success:#4caf50;--color-error:#e57373;--color-warn:#f59e0b;
  --text-normal:#c6c6c6;--text-soft:#a0a0a0;--text-muted:#7a7a7a;--text-faint:#5a5a5a;
  --border-subtle:rgba(255,255,255,0.06);--border-normal:rgba(255,255,255,0.09);
  --border-visible:rgba(255,255,255,0.14);
  --radius-s:5px;--radius-m:7px;--radius-l:15px;
  --font-text:Bookerly,'Inter',"Segoe UI","霞鹜文楷 GB","LXGW WenKai","Microsoft YaHei",sans-serif;
  --font-mono:'JetBrains Mono',Consolas,Monaco,monospace;
  --h1-size:1.75em;--h2-size:1.6em;--h3-size:1.45em;--h4-size:1.3em;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{background:var(--bg-primary);color:var(--text-normal);font-family:var(--font-text);font-size:17px;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.app{display:flex;height:100vh;height:100dvh}

/* ── SIDEBAR ── */
.sidebar{width:300px;min-width:300px;background:var(--bg-secondary);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;overflow:hidden;z-index:10;transition:width .25s,min-width .25s,border .25s}
.sidebar.collapsed{width:0;min-width:0;border-right:none}
.sidebar-header{padding:.9rem 1.1rem;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;gap:.55rem;flex-shrink:0;background:var(--bg-secondary)}
.sidebar-header .back{color:var(--text-muted);text-decoration:none;font-size:1rem;transition:color .15s}
.sidebar-header .back:hover{color:var(--text-normal)}
.sidebar-header h2{font-size:.9rem;font-weight:600;color:var(--text-normal);flex:1;letter-spacing:.01em}
.sidebar-header .settings-btn{background:none;border:none;color:var(--text-muted);font-size:1.1rem;cursor:pointer;padding:3px 7px;border-radius:var(--radius-s);transition:color .15s,background .15s}
.sidebar-header .settings-btn:hover{color:var(--text-normal);background:var(--bg-hover)}
.sidebar-header .collapse-all{background:none;border:none;color:var(--text-faint);font-size:.7rem;cursor:pointer;padding:3px 8px;border-radius:var(--radius-s);font-family:inherit;transition:color .15s,background .15s}
.sidebar-header .collapse-all:hover{color:var(--text-muted);background:var(--bg-hover)}
.sidebar-header .sidebar-toggle{background:none;border:none;color:var(--text-muted);font-size:.75rem;cursor:pointer;padding:3px 6px;border-radius:var(--radius-s);font-family:inherit;transition:color .15s,background .15s;margin-right:.25rem}
.sidebar-header .sidebar-toggle:hover{color:var(--text-normal);background:var(--bg-hover)}

.sidebar-tree{flex:1;overflow-y:auto;overflow-x:hidden;padding:.15rem 0;-webkit-overflow-scrolling:touch}
.sidebar-tree::-webkit-scrollbar{width:3px}
.sidebar-tree::-webkit-scrollbar-thumb{background:var(--border-visible);border-radius:3px}

/* Chapter */
.chapter-group{margin:1px 0}
.chapter-group + .chapter-group{border-top:1px solid var(--border-subtle)}
.era-toggle{display:flex;align-items:center;gap:.45rem;padding:.6rem 1.1rem;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--text-soft);transition:color .15s,background .15s;user-select:none;border:none;background:none;width:100%;text-align:left;font-family:inherit;letter-spacing:.01em}
.era-toggle:hover{color:var(--text-normal);background:var(--bg-hover)}
.era-toggle .arrow{font-size:.48rem;transition:transform .2s;display:inline-block;color:var(--text-faint);line-height:1;width:10px;text-align:center;flex-shrink:0}
.era-toggle .ch-num{font-size:.62rem;color:var(--text-faint);font-family:var(--font-mono);background:var(--bg-surface);padding:1px 6px;border-radius:3px;flex-shrink:0}
.era-toggle .ch-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.era-toggle .ch-progress{font-size:.6rem;color:var(--text-faint);flex-shrink:0}

/* Lessons (default collapsed) */
.era-lessons{display:none}
.era-lessons.open{display:block}
.lesson-item{display:flex;align-items:center;gap:.4rem;padding:.42rem 1.1rem .42rem 2.2rem;cursor:pointer;font-size:.78rem;color:var(--text-muted);transition:color .15s,background .15s;border-left:3px solid transparent;position:relative}
.lesson-item:hover{color:var(--text-normal);background:var(--bg-hover)}
.lesson-item.active{color:var(--color-accent-light);background:var(--color-accent-glow);border-left-color:var(--color-accent)}
.lesson-item .sec-id{color:var(--text-faint);font-family:var(--font-mono);font-size:.63rem;min-width:3.2rem;flex-shrink:0}
.lesson-item .sec-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson-item .sec-status{font-size:.6rem;flex-shrink:0;margin-left:.15rem}
.lesson-item .gen-btn{display:none;background:var(--color-accent-soft);border:1px solid var(--color-accent);color:var(--color-accent-light);border-radius:var(--radius-s);padding:1px 8px;font-size:.62rem;cursor:pointer;margin-left:auto;white-space:nowrap;font-family:inherit;touch-action:manipulation;flex-shrink:0}
.lesson-item:hover .gen-btn{display:inline-block}
.lesson-item .gen-btn:active{background:var(--color-accent)}

/* File tabs in topbar — show 5 files as vertical nav pills */
.file-tabs{display:flex;gap:2px;background:var(--bg-hover);border-radius:var(--radius-m);padding:3px}
.file-tab{padding:3px 10px;border-radius:var(--radius-s);font-size:.68rem;cursor:pointer;border:none;background:transparent;color:var(--text-muted);transition:all .15s;font-family:inherit;white-space:nowrap;touch-action:manipulation;display:flex;align-items:center;gap:.25rem}
.file-tab:hover{color:var(--text-normal);background:rgba(255,255,255,0.04)}
.file-tab.active{background:var(--color-accent);color:#fff}
.file-tab .tab-dot{width:5px;height:5px;border-radius:50%;background:var(--color-success);flex-shrink:0}
.file-tab:not(.has-file) .tab-dot{background:var(--text-faint)}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg-primary)}
.topbar{padding:.5rem 1.2rem;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;gap:.6rem;flex-shrink:0;background:var(--bg-secondary);flex-wrap:wrap}
.menu-btn{display:none;background:none;border:none;color:var(--text-muted);font-size:1.1rem;cursor:pointer;padding:4px}
.topbar .lesson-title{font-size:.8rem;font-weight:600;flex:1;min-width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-normal)}

.content{flex:1;overflow-y:auto;padding:2rem 2.5rem;-webkit-overflow-scrolling:touch}
.content::-webkit-scrollbar{width:5px}
.content::-webkit-scrollbar-thumb{background:var(--border-visible);border-radius:5px}

/* Markdown */
.rendered{max-width:780px;margin:0 auto;line-height:1.75}
.rendered h1{font-size:var(--h1-size);font-weight:700;color:var(--text-normal);margin:2rem 0 1rem;padding-bottom:.4rem;border-bottom:2px solid var(--color-accent);line-height:1.3}
.rendered h2{font-size:var(--h2-size);font-weight:600;color:var(--text-normal);margin:1.8rem 0 .8rem;padding-bottom:.3rem;border-bottom:1px solid var(--border-visible);line-height:1.35}
.rendered h3{font-size:var(--h3-size);font-weight:600;color:var(--color-accent-light);margin:1.5rem 0 .6rem;line-height:1.4}
.rendered h4{font-size:var(--h4-size);font-weight:600;color:#e8c479;margin:1.2rem 0 .5rem;font-family:var(--font-mono)}
.rendered p{color:var(--text-normal);line-height:1.8;margin:.7rem 0;font-size:1em}
.rendered strong{color:#e0e0e0}
.rendered blockquote{border-left:3px solid var(--color-accent);margin:1.2rem 0;padding:.7rem 1.1rem;background:var(--color-accent-glow);border-radius:0 var(--radius-s) var(--radius-s) 0;color:var(--text-soft)}
.rendered a{color:var(--color-accent-light);text-decoration:none}
.rendered code{background:rgba(255,255,255,0.06);padding:2px 7px;border-radius:4px;font-family:var(--font-mono);font-size:.85em;color:#8bc49a;border:none}
.rendered pre{border:1px solid #3e3e42;border-radius:8px;padding:0;overflow-x:auto;margin:1.2rem 0;font-size:.85rem;line-height:1.7}
.rendered pre code.hljs{padding:1.2rem 1.4rem;display:block}
/* ── Syntax: Python VS Code Dark+ ── */
.hljs{color:#d4d4d4;background:transparent}
.hljs-keyword,.hljs-literal,.hljs-selector-tag{color:#569cd6}
.hljs-built_in,.hljs-type,.hljs-class .hljs-title{color:#4ec9b0}
.hljs-string,.hljs-regexp,.hljs-addition{color:#ce9178}
.hljs-number,.hljs-meta .hljs-string{color:#b5cea8}
.hljs-comment,.hljs-quote{color:#6a9955;font-style:italic}
.hljs-function .hljs-title,.hljs-title.function_{color:#dcdcaa}
.hljs-attr,.hljs-attribute,.hljs-variable{color:#9cdcfe}
.hljs-params{color:#d4d4d4}
.hljs-meta,.hljs-decorator{color:#dcdcaa}
.hljs-symbol,.hljs-template-variable{color:#ce9178}
.hljs-doctag,.hljs-section{color:#569cd6}
.hljs-name{color:#569cd6}
.hljs-tag{color:#569cd6}
.hljs-title{color:#dcdcaa}
.hljs-operator,.hljs-punctuation{color:#d4d4d4}
.hljs-emphasis{font-style:italic}.hljs-strong{font-weight:700}
.rendered pre code{background:none;padding:0;color:#d4d4d4;border:none;font-size:inherit;font-family:var(--font-mono);font-weight:400}
.rendered table{border-collapse:collapse;width:100%;margin:1.2rem 0;font-size:.9em}
.rendered th,.rendered td{border:1px solid var(--border-subtle);padding:.5rem .9rem;text-align:left}
.rendered th{background:var(--color-accent-soft);color:var(--text-normal);font-weight:600}
.rendered ul,.rendered ol{padding-left:1.6rem;margin:.6rem 0;color:var(--text-normal);line-height:1.9}
.rendered li::marker{color:var(--text-faint)}
.rendered hr{border:none;border-top:1px solid var(--border-subtle);margin:2.5rem 0}

.empty-state,.gen-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-muted);text-align:center;padding:2rem}
.empty-state .icon{font-size:3rem;margin-bottom:1rem;opacity:.6}
.empty-state h3{font-size:1.1rem;margin-bottom:.5rem;color:var(--text-soft)}
.gen-panel .streaming{width:100%;max-width:700px;background:var(--bg-surface);border:1px solid var(--border-normal);border-radius:var(--radius-m);padding:1.2rem;font-family:var(--font-mono);font-size:.82rem;line-height:1.7;white-space:pre-wrap;word-break:break-word;text-align:left;min-height:200px;max-height:50vh;overflow-y:auto;color:var(--text-soft)}
.gen-panel .gen-status{margin-top:.8rem;font-size:.8rem}
.loader{text-align:center;padding:3rem;color:var(--text-muted)}
.loader .spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--border-visible);border-top-color:var(--color-accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:.6rem}
@keyframes spin{to{transform:rotate(360deg)}}

/* Settings modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:100;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:var(--bg-secondary);border:1px solid var(--border-normal);border-radius:var(--radius-l);padding:1.5rem;max-width:400px;width:90%}
.modal h3{font-size:1rem;margin-bottom:.8rem}
.modal label{display:block;font-size:.75rem;color:var(--text-muted);margin:.5rem 0 .2rem}
.modal input{width:100%;background:var(--bg-surface);color:var(--text-normal);border:1px solid var(--border-normal);border-radius:var(--radius-s);padding:.5rem .7rem;font-family:var(--font-mono);font-size:.8rem;outline:none}
.modal input:focus{border-color:var(--color-accent)}
.modal .btn-row{display:flex;gap:.5rem;margin-top:1rem;justify-content:flex-end}
.btn{padding:.5rem 1.1rem;border-radius:var(--radius-s);font-size:.8rem;font-weight:600;cursor:pointer;border:none;font-family:inherit;touch-action:manipulation}
.btn-primary{background:var(--color-accent);color:#fff}
.btn-outline{background:transparent;color:var(--text-soft);border:1px solid var(--border-normal)}
.btn-success{background:var(--color-success);color:#fff}
.btn-warn{background:var(--color-warn);color:#000}

.sidebar-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9}
.sidebar-expand-tab{display:none;position:fixed;left:0;top:50%;transform:translateY(-50%);background:var(--bg-secondary);border:1px solid var(--border-normal);border-left:none;border-radius:0 var(--radius-m) var(--radius-m) 0;padding:1rem .35rem;cursor:pointer;z-index:11;color:var(--text-muted);font-size:.7rem;writing-mode:vertical-lr;transition:color .15s,background .15s}
.sidebar-expand-tab:hover{color:var(--text-normal);background:var(--bg-hover)}
.sidebar.collapsed ~ .sidebar-expand-tab{display:block}
.action-bar{display:flex;gap:.4rem;align-items:center}
.action-bar .gen-section-btn{padding:4px 12px;border-radius:var(--radius-s);font-size:.7rem;cursor:pointer;border:1px solid var(--color-accent);background:var(--color-accent-soft);color:var(--color-accent-light);font-family:inherit;white-space:nowrap;touch-action:manipulation}
.action-bar .gen-section-btn:hover{background:var(--color-accent);color:#fff}
.action-bar .gen-section-btn:disabled{opacity:.4;cursor:not-allowed}
.action-bar .gen-section-btn.generating{border-color:var(--color-warn);color:var(--color-warn);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);z-index:20}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.active{display:block}
  .menu-btn{display:inline-block}
  .content{padding:1rem}
  .rendered h1{font-size:1.5em}.rendered h2{font-size:1.35em}
}
@media(max-width:400px){.sidebar{width:100%;min-width:100%}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
<div class="sidebar-overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <button class="sidebar-toggle" id="sidebarToggle" title="收起侧边栏">◀</button>
    <a href="../../" class="back">←</a><h2>🧠 DL Math</h2>
    <button class="collapse-all" id="collapseAll" title="折叠全部章节">⊟</button>
    <button class="settings-btn" onclick="openSettings()" title="设置 API 密钥">⚙️</button>
  </div>
  <div class="sidebar-tree" id="tree"></div>
</aside>
<div class="sidebar-expand-tab" id="sidebarExpandTab" title="展开侧边栏">侧边栏 ▶</div>

<main class="main">
  <div class="topbar">
    <button class="menu-btn" id="menuBtn">☰</button>
    <span class="lesson-title" id="lessonTitle">选择一节课</span>
    <div class="action-bar" id="actionBar"></div>
    <div class="file-tabs" id="fileTabs"></div>
  </div>
  <div class="content" id="content">
    <div class="empty-state">
      <div class="icon">🧠</div><h3>Deep Learning Math</h3>
      <p>Mathematical Foundations for Deep Learning<br>Ghayoumi · 2026 · 203 subsections</p>
      <p style="font-size:.8rem;margin-top:.6rem;color:var(--text-muted)">左侧选课 · ⚡ 一键生成 · 自动保存</p>
    </div>
  </div>
</main>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
<div class="modal">
  <h3>⚙️ API 密钥</h3>
  <p style="font-size:.75rem;color:var(--text-muted);margin-bottom:.5rem">密钥只存浏览器，不上传任何服务器</p>
  <label>DeepSeek API Key</label>
  <input type="password" id="dsKey" placeholder="sk-...">
  <label>GitHub Token <span style="color:var(--text-faint)">(需要 repo 权限)</span></label>
  <input type="password" id="ghToken" placeholder="ghp_...">
  <p style="font-size:.65rem;color:var(--text-muted);margin-top:.3rem"><a href="https://github.com/settings/tokens/new" target="_blank" style="color:var(--color-accent-light)">创建 GitHub Token →</a> 勾选 repo</p>
  <div class="btn-row">
    <button class="btn btn-outline" onclick="closeSettings()">取消</button>
    <button class="btn btn-primary" onclick="saveSettings()">保存</button>
  </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/json.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script>
/* ══════════════════════════════════════════
   CONFIG — 6 file types
   ══════════════════════════════════════════ */
var CONFIG={
  repo:'LaFloraison/DL-Math',branch:'main',
  lessonsDir:'lessons',chaptersDir:'decomposition/chapters',
  fileTypes:[
    {id:'历史',icon:'📜',label:'历史'},
    {id:'主线',icon:'🧠',label:'主线'},
    {id:'代码',icon:'💻',label:'代码'},
    {id:'习题',icon:'✏️',label:'习题'},
    {id:'镜鉴',icon:'🪞',label:'镜鉴'},
    {id:'参考资料',icon:'📚',label:'参考'}
  ],
  /* Generation order — first file is the entry point */
  genOrder:['历史','主线','代码','习题','镜鉴','参考资料']
};

var state={
  chapters:[],lessonFolders:{},generatedFiles:{},
  currentCh:null,currentSec:null,currentFile:'主线',
  generating:false,genContent:''
};

/* ── DOM ── */
var sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay');
var treeEl=document.getElementById('tree'),contentEl=document.getElementById('content');
var lessonTitle=document.getElementById('lessonTitle'),fileTabs=document.getElementById('fileTabs');
var actionBar=document.getElementById('actionBar'),menuBtn=document.getElementById('menuBtn');
var collapseAllBtn=document.getElementById('collapseAll');

menuBtn.addEventListener('click',function(){sidebar.classList.toggle('open');overlay.classList.toggle('active')});
overlay.addEventListener('click',function(){sidebar.classList.remove('open');overlay.classList.remove('active')});

/* Sidebar toggle */
var sidebarToggle=document.getElementById('sidebarToggle');
var sidebarExpandTab=document.getElementById('sidebarExpandTab');
sidebarToggle.addEventListener('click',function(){
  sidebar.classList.add('collapsed');
});
sidebarExpandTab.addEventListener('click',function(){
  sidebar.classList.remove('collapsed');
});

/* Collapse all chapters */
collapseAllBtn.addEventListener('click',function(){
  treeEl.querySelectorAll('.era-toggle.open').forEach(function(t){t.click()});
});

/* ══════════════════════════════════════════
   SETTINGS
   ══════════════════════════════════════════ */
function getDSKey(){return localStorage.getItem('dsKey')||''}
function getGHToken(){return localStorage.getItem('ghToken')||''}
function openSettings(){
  document.getElementById('dsKey').value=getDSKey();
  document.getElementById('ghToken').value=getGHToken();
  document.getElementById('settingsModal').classList.add('active');
}
function closeSettings(){document.getElementById('settingsModal').classList.remove('active')}
function saveSettings(){
  var ds=document.getElementById('dsKey').value.trim();
  var gh=document.getElementById('ghToken').value.trim();
  if(ds)localStorage.setItem('dsKey',ds);
  if(gh)localStorage.setItem('ghToken',gh);
  closeSettings();
  if(!ds||!gh)alert('请填写两个密钥');else toast('已保存');
}
if(!getDSKey()||!getGHToken()){setTimeout(openSettings,500)}

/* ══════════════════════════════════════════
   LOAD CHAPTER TREE
   ══════════════════════════════════════════ */
function loadTree(){
  treeEl.innerHTML='<div class="loader"><div class="spinner"></div></div>';

  var nocache='?_='+Date.now();
  var manifestUrl='https://raw.githubusercontent.com/'+CONFIG.repo+'/'+CONFIG.branch+'/manifest.json'+nocache;
  var lesApi='https://api.github.com/repos/'+CONFIG.repo+'/contents/'+CONFIG.lessonsDir+'?ref='+CONFIG.branch;

  Promise.all([
    fetch(manifestUrl).then(r=>r.ok?r.json():null).catch(()=>null),
    fetch(lesApi,{headers:{Accept:'application/vnd.github.v3+json'}}).then(r=>r.ok?r.json():[]).catch(()=>[])
  ]).then(function(results){
    var manifest=results[0], lesItems=results[1];

    if(!manifest||!manifest.chapters){
      treeEl.innerHTML='<div style="color:var(--color-error);padding:1rem">无法加载课程目录</div>';
      return;
    }

    state.generatedFiles={};
    var folderPromises=[];
    for(var i=0;i<lesItems.length;i++){
      if(lesItems[i].type==='dir'){
        var fm=lesItems[i].name.match(/第\d+节-([^-]+)/);
        if(fm){
          var secId=fm[1];
          state.lessonFolders[secId]=lesItems[i].name;
          (function(sid,url){
            folderPromises.push(
              fetch(url+'?ref='+CONFIG.branch,{headers:{Accept:'application/vnd.github.v3+json'}})
                .then(function(r){return r.ok?r.json():[]}).catch(function(){return []})
                .then(function(files){
                  state.generatedFiles[sid]=files.filter(function(f){return f.type==='file'&&f.name.endsWith('.md')}).map(function(f){return f.name.replace('.md','')});
                })
            );
          })(secId,lesItems[i].url);
        }
      }
    }

    return Promise.all(folderPromises).then(function(){
      state.chapters=manifest.chapters.map(function(ch){
        ch.sections.forEach(function(sec){
          if(!sec.path){
            var chDir='ch'+ch.num+'-'+ch.name.replace(/\s+/g,'-');
            var secFile='sec-'+sec.id+'-'+sec.title.replace(/\s/g,'-')+'.txt';
            sec.path=CONFIG.chaptersDir+'/'+chDir+'/'+secFile;
          }
        });
        return ch;
      });
      renderTree();
    });
  }).catch(function(e){
    treeEl.innerHTML='<div style="color:var(--color-error);padding:1rem;font-size:.8rem">Load error: '+e.message+'</div>';
  });
}

/* ══════════════════════════════════════════
   RENDER TREE — all chapters collapsed by default
   ══════════════════════════════════════════ */
function renderTree(){
  var TOTAL=CONFIG.fileTypes.length;
  var html='';
  for(var ci=0;ci<state.chapters.length;ci++){
    var ch=state.chapters[ci];
    /* Count progress */
    var done=0,totalSecs=ch.sections.length;
    for(var si=0;si<totalSecs;si++){
      var gf=state.generatedFiles[ch.sections[si].id]||[];
      if(gf.length>=TOTAL)done++;
    }
    var progressText=done+'/'+totalSecs;
    var progressPercent=totalSecs>0?Math.round(done/totalSecs*100):0;

    html+='<div class="chapter-group">'+
      '<button class="era-toggle" data-ch="'+ci+'">'+
        '<span class="arrow">▶</span>'+
        '<span class="ch-num">Ch'+ch.num+'</span>'+
        '<span class="ch-name" title="'+ch.name+'">'+ch.name+'</span>'+
        '<span class="ch-progress">'+progressText+'</span>'+
      '</button>'+
      '<div class="era-lessons" data-ch-list="'+ci+'">';
    for(var si=0;si<totalSecs;si++){
      var sec=ch.sections[si];
      var gf=state.generatedFiles[sec.id]||[];
      var hasAll=gf.length>=TOTAL;
      var hasSome=gf.length>0;
      var statusIcon=hasAll?'✅':hasSome?'📝':'';
      html+='<div class="lesson-item" data-ch="'+ci+'" data-sec="'+si+'" data-sid="'+sec.id+'">'+
        '<span class="sec-id">'+sec.id+'</span>'+
        '<span class="sec-title" title="'+sec.title+'">'+sec.title+'</span>'+
        (statusIcon?'<span class="sec-status">'+statusIcon+'</span>':'')+
        (!hasAll?'<button class="gen-btn" data-ch="'+ci+'" data-sec="'+si+'">⚡</button>':'')+
      '</div>';
    }
    html+='</div></div>';
  }
  treeEl.innerHTML=html;

  /* Toggle chapter */
  treeEl.querySelectorAll('.era-toggle').forEach(function(btn){
    btn.addEventListener('click',function(){
      var ci=this.dataset.ch;
      var list=treeEl.querySelector('[data-ch-list="'+ci+'"]');
      var arrow=this.querySelector('.arrow');
      this.classList.toggle('open');
      list.classList.toggle('open');
      if(this.classList.contains('open')){arrow.style.transform='rotate(90deg)'}
      else{arrow.style.transform=''}
    });
  });

  /* Select lesson */
  treeEl.querySelectorAll('.lesson-item').forEach(function(item){
    item.addEventListener('click',function(e){
      if(e.target.classList.contains('gen-btn'))return;
      var ci=parseInt(this.dataset.ch),si=parseInt(this.dataset.sec);
      selectSection(state.chapters[ci],state.chapters[ci].sections[si]);
      sidebar.classList.remove('open');overlay.classList.remove('active');
    });
  });

  /* Generate button */
  treeEl.querySelectorAll('.gen-btn').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      var ci=parseInt(this.dataset.ch),si=parseInt(this.dataset.sec);
      if(!getDSKey()||!getGHToken()){openSettings();return}
      /* Select section, default to first missing file */
      var sec=state.chapters[ci].sections[si];
      var gf=state.generatedFiles[sec.id]||[];
      var firstMissing=null;
      for(var fi=0;fi<CONFIG.genOrder.length;fi++){
        if(gf.indexOf(CONFIG.genOrder[fi])<0){firstMissing=CONFIG.genOrder[fi];break}
      }
      if(firstMissing)state.currentFile=firstMissing;
      selectSection(state.chapters[ci],sec);
      sidebar.classList.remove('open');overlay.classList.remove('active');
    });
  });
}

/* ══════════════════════════════════════════
   SELECT & LOAD
   ══════════════════════════════════════════ */
function selectSection(ch,sec){
  state.currentCh=ch;state.currentSec=sec;
  if(!state.currentFile||CONFIG.fileTypes.every(function(ft){return ft.id!==state.currentFile}))state.currentFile='主线';
  treeEl.querySelectorAll('.lesson-item').forEach(function(el){el.classList.remove('active')});
  var ael=treeEl.querySelector('[data-sid="'+sec.id+'"]');if(ael)ael.classList.add('active');
  lessonTitle.textContent='Ch'+ch.num+' §'+sec.id+' '+sec.title;
  renderFileTabs();renderActionBar();
  loadFile(state.currentFile);
}

function renderFileTabs(){
  var generated=state.generatedFiles[(state.currentSec||{}).id]||[];
  var html='';
  CONFIG.fileTypes.forEach(function(ft){
    var active=ft.id===state.currentFile?' active':'';
    var hasIt=generated.indexOf(ft.id)>=0;
    html+='<button class="file-tab'+active+(hasIt?' has-file':'')+'" data-file="'+ft.id+'">'+
      '<span class="tab-dot"></span>'+ft.icon+' '+ft.label+'</button>';
  });
  fileTabs.innerHTML=html;
  fileTabs.querySelectorAll('.file-tab').forEach(function(tab){
    tab.addEventListener('click',function(){loadFile(this.dataset.file)});
  });
}

function renderActionBar(){
  var generated=state.generatedFiles[(state.currentSec||{}).id]||[];
  var currentMissing=generated.indexOf(state.currentFile)<0;
  actionBar.innerHTML='';
  if(!currentMissing)return;
  var genLabel=state.generating?'⏳ 生成中…':'⚡ 生成 '+state.currentFile;
  actionBar.innerHTML='<button class="gen-section-btn'+(state.generating?' generating':'')+'" id="genSectionBtn" '+(state.generating?'disabled':'')+'>'+genLabel+'</button>';
  var btn=document.getElementById('genSectionBtn');
  if(btn)btn.addEventListener('click',function(){
    if(!getDSKey()||!getGHToken()){openSettings();return}
    generateCurrentFile();
  });
}

function loadFile(fileId){
  state.currentFile=fileId;
  fileTabs.querySelectorAll('.file-tab').forEach(function(t){t.classList.toggle('active',t.dataset.file===fileId)});
  renderActionBar();

  if(!state.currentSec){return}
  var ch=state.currentCh,sec=state.currentSec;
  var shortTitle=sec.title.replace(/\s+/g,'-').replace(/[^a-zA-Z0-9\-]/g,'').substring(0,30);
  var folderName=state.lessonFolders[sec.id]||('第'+ch.num+'节-'+sec.id+'-'+shortTitle);
  var url='https://raw.githubusercontent.com/'+CONFIG.repo+'/'+CONFIG.branch+'/'+
    CONFIG.lessonsDir+'/'+encodeURIComponent(folderName)+'/'+encodeURIComponent(fileId+'.md');

  contentEl.innerHTML='<div class="loader"><div class="spinner"></div></div>';
  fetch(url).then(function(r){if(!r.ok)throw new Error('不存在');return r.text()})
    .then(function(md){
      if(!state.generatedFiles[sec.id])state.generatedFiles[sec.id]=[];
      if(state.generatedFiles[sec.id].indexOf(fileId)<0)state.generatedFiles[sec.id].push(fileId);
      if(!state.lessonFolders[sec.id])state.lessonFolders[sec.id]=folderName;
      renderFileTabs();renderActionBar();renderMarkdown(md);
    })
    .catch(function(e){
      contentEl.innerHTML='<div class="empty-state"><div class="icon">🔮</div>'+
        '<h3>'+fileId+' 还没有生成</h3>'+
        '<p>'+sec.id+' '+sec.title+'</p>'+
        '<button class="btn btn-primary" style="margin-top:1rem" onclick="generateCurrentFile()">⚡ 生成 '+fileId+'</button>'+
      '</div>';
    });
}

function renderMarkdown(md){
  var body=md;
  if(md.indexOf('---')===0){var end=md.indexOf('---',3);if(end>0)body=md.substring(end+3).trim()}
  var html='';
  try{if(typeof marked!=='undefined'){marked.setOptions({breaks:true,gfm:true});html=marked.parse(body)}}catch(e){}
  contentEl.innerHTML='<div class="rendered">'+html+'</div>';
  if(typeof hljs!=='undefined'){contentEl.querySelectorAll('pre code').forEach(function(el){hljs.highlightElement(el)})}
  if(typeof renderMathInElement!=='undefined'){
    try{renderMathInElement(contentEl.querySelector('.rendered'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}catch(e){}
  }
}

/* ══════════════════════════════════════════
   GENERATE
   ══════════════════════════════════════════ */
function generateCurrentFile(){
  if(!state.currentCh||!state.currentSec)return;
  generateSection(state.currentCh,state.currentSec);
}

function generateSection(ch,sec){
  if(state.generating)return;
  state.generating=true;state.genContent='';
  renderActionBar();
  contentEl.innerHTML='<div class="gen-panel"><div class="streaming" id="genStream"></div><div class="gen-status" id="genStatus">⏳ 加载教材原文…</div></div>';

  var dsKey=getDSKey();
  var fileType=state.currentFile;

  Promise.all([
    fetch('https://raw.githubusercontent.com/'+CONFIG.repo+'/'+CONFIG.branch+'/CLAUDE.md').then(function(r){return r.ok?r.text():''}).catch(function(){return ''}),
    fetch('https://raw.githubusercontent.com/'+CONFIG.repo+'/'+CONFIG.branch+'/'+sec.path).then(function(r){return r.ok?r.text():''}).catch(function(){return ''})
  ]).then(function(results){
    var claudeMd=results[0],secText=results[1];

    /* Build targeted prompt based on file type */
    var fileInstruction='';
    switch(fileType){
      case '历史':
        fileInstruction='请生成【历史.md】。按照 CLAUDE.md 中"历史.md 结构"的写作纪律：画面感优先、悬念驱动、不引入技术符号、择一历史源流深入（数学史或DL史），结尾留一扇门引向主线。篇幅 5-8 min 阅读量。';
        break;
      case '主线':
        fileInstruction='请生成【主线.md】。按照 CLAUDE.md 中"主线.md 三步结构"：(1) Toy Model——纯直觉模型，不写代码，用几何画面/物理类比/微型手算让读者先感受概念；(2) 正式数学讲解——动机先行（亮代价→给原理→落回本节），每个定义出现前先问"为什么需要它"，推导优于宣告，至少一处边界声明；(3) 概念性DL桥接——不写代码，只用数学符号描述概念在DL中的位置，结尾指向代码.md。';
        break;
      case '代码':
        fileInstruction='请生成【代码.md】。按照 CLAUDE.md 中"代码.md 结构"：先完整可运行脚本（20-40行，透明数学操作，无黑盒API），然后分步逐函数拆解。每个函数按"做什么/操作/输入/输出/可调参数/对应数学"格式，每个参数讲透含义和取值范围。';
        break;
      case '习题':
        fileInstruction='请生成【习题.md】。按照 CLAUDE.md 中"习题.md 结构"：概念检验（2-3题）、计算实践（2-3题，含代码验证）、DL延伸（1-2题）。每题附完整解答和思路点拨。';
        break;
      case '镜鉴':
        fileInstruction='请生成【镜鉴.md】。按照 CLAUDE.md 中"镜鉴.md 结构"：数学之美、DL中的意义、人的映射、开放问题。每个部分150-250字，全文600-1000字。不写鸡汤——每一句都要从概念本身的结构出发做类比。';
        break;
      case '参考资料':
        fileInstruction='请生成【参考资料.md】。按照 CLAUDE.md 中"参考资料.md 结构"：教材出处、延伸论文、代码库/工具、推荐阅读。按本节内容灵活选择，不为凑字数而填满。';
        break;
    }

    var systemPrompt='你是一位深度学习数学导师。请严格遵循以下教学指令：\n\n'+claudeMd+'\n\n---\n\n请只输出最终的课程内容（Markdown格式），不要包含任何元对话或解释。';
    var userPrompt=fileInstruction+'\n\n- 章节：Ch'+ch.num+' §'+sec.id+' '+sec.title+'\n- 文件类型：'+fileType+'\n';
    if(secText){
      if(fileType==='历史')userPrompt+='\n以下是教材原文参考（了解本节涉及的数学概念，但历史叙事不要复述教材——去找这个概念"必须被发明"的时刻）：\n\n'+secText.substring(0,30000)+'\n';
      else userPrompt+='\n以下是教材原文参考（请基于此内容生成，逐一覆盖每个关键定义、定理和示例，不得跳过）：\n\n'+secText.substring(0,50000)+'\n';
    }
    userPrompt+='\n请开始生成。';

    document.getElementById('genStatus').textContent='⏳ DeepSeek 正在生成 '+fileType+'…';
    return fetch('https://api.deepseek.com/v1/chat/completions',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+dsKey},
      body:JSON.stringify({model:'deepseek-chat',messages:[{role:'system',content:systemPrompt},{role:'user',content:userPrompt}],stream:true,temperature:.7,max_tokens:16384})
    });
  })
  .then(function(res){if(!res.ok)return res.text().then(function(t){throw new Error('API '+res.status+': '+t.substring(0,200))});return readStream(res);})
  .catch(function(e){
    contentEl.innerHTML='<div class="empty-state"><div class="icon">❌</div><h3>生成失败</h3><p>'+e.message+'</p></div>';
    state.generating=false;renderActionBar();
  });
}

function readStream(response){
  var reader=response.body.getReader(),decoder=new TextDecoder(),buffer='';
  var streamEl=document.getElementById('genStream');
  function pump(){
    reader.read().then(function(result){
      if(result.done){
        document.getElementById('genStatus').textContent='✅ 生成完成 — '+state.genContent.length+' 字符 · 正在保存到 GitHub…';
        commitGenerated();
        return;
      }
      buffer+=decoder.decode(result.value,{stream:true});
      var lines=buffer.split('\n');buffer=lines.pop()||'';
      for(var i=0;i<lines.length;i++){
        if(!lines[i].startsWith('data: '))continue;
        var d=lines[i].slice(6).trim();if(d==='[DONE]')continue;
        try{var p=JSON.parse(d);var delta=p.choices?.[0]?.delta?.content;if(delta){state.genContent+=delta;streamEl.textContent=state.genContent;streamEl.scrollTop=streamEl.scrollHeight}}catch(e){}
      }
      pump();
    });
  }
  pump();
}

/* ══════════════════════════════════════════
   COMMIT TO GITHUB
   ══════════════════════════════════════════ */
function commitGenerated(){
  var ghToken=getGHToken();
  if(!ghToken||!state.genContent){finishGeneration(false);return}
  var ch=state.currentCh,sec=state.currentSec;
  var shortTitle=sec.title.replace(/\s+/g,'-').replace(/[^a-zA-Z0-9\-]/g,'').substring(0,30);
  var folderName=state.lessonFolders[sec.id]||('第'+ch.num+'节-'+sec.id+'-'+shortTitle);
  var filePath=CONFIG.lessonsDir+'/'+folderName+'/'+state.currentFile+'.md';
  var apiUrl='https://api.github.com/repos/'+CONFIG.repo+'/contents/'+filePath+'?ref='+CONFIG.branch;

  fetch(apiUrl,{headers:{Authorization:'Bearer '+ghToken,Accept:'application/vnd.github.v3+json'}})
    .then(function(r){return r.ok?r.json():null})
    .then(function(existing){
      var body={message:'📱 生成: '+state.currentFile+' — Ch'+ch.num+' §'+sec.id+' '+sec.title,content:btoa(unescape(encodeURIComponent(state.genContent))),branch:CONFIG.branch};
      if(existing&&existing.sha)body.sha=existing.sha;
      return fetch(apiUrl,{method:'PUT',headers:{Authorization:'Bearer '+ghToken,'Content-Type':'application/json',Accept:'application/vnd.github.v3+json'},body:JSON.stringify(body)});
    })
    .then(function(r){if(!r.ok)return r.json().then(function(e){throw new Error(e.message||'HTTP '+r.status)});return r.json()})
    .then(function(){
      if(!state.generatedFiles[sec.id])state.generatedFiles[sec.id]=[];
      if(state.generatedFiles[sec.id].indexOf(state.currentFile)<0)state.generatedFiles[sec.id].push(state.currentFile);
      if(!state.lessonFolders[sec.id])state.lessonFolders[sec.id]=folderName;
      renderTree();renderFileTabs();renderActionBar();
      renderMarkdown(state.genContent);
      toast('✅ '+state.currentFile+' 已保存到 GitHub');
      state.generating=false;renderActionBar();
    })
    .catch(function(e){toast('❌ 保存失败: '+e.message);finishGeneration(false)});
}

function finishGeneration(ok){
  state.generating=false;renderActionBar();
}

/* ══════════════════════════════════════════
   TOAST
   ══════════════════════════════════════════ */
function toast(msg){
  var el=document.createElement('div');
  el.style.cssText='position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--bg-surface);border:1px solid var(--border-normal);border-radius:var(--radius-m);padding:.6rem 1.2rem;font-size:.8rem;z-index:200;box-shadow:0 4px 24px rgba(0,0,0,.3)';
  el.textContent=msg;document.body.appendChild(el);
  setTimeout(function(){el.remove()},2500);
}

/* ══════════════════════════════════════════
   KEYBOARD
   ══════════════════════════════════════════ */
document.addEventListener('keydown',function(e){
  if(!state.currentCh||!state.currentSec)return;
  var ch=state.currentCh,sec=state.currentSec;
  var ci=state.chapters.indexOf(ch),si=ch.sections.indexOf(sec);

  /* 1-6: switch file tab */
  var keyMap={'1':'历史','2':'主线','3':'代码','4':'习题','5':'镜鉴','6':'参考资料'};
  if(keyMap[e.key]){e.preventDefault();loadFile(keyMap[e.key]);return}

  /* Left/Right: prev/next file, wrap to prev/next section */
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
    e.preventDefault();
    var files=CONFIG.fileTypes.map(function(f){return f.id});
    var fi=files.indexOf(state.currentFile);
    if(e.key==='ArrowRight'){
      if(fi+1<files.length){loadFile(files[fi+1])}
      else{
        /* Last file → first file of next section */
        if(si+1<ch.sections.length){state.currentFile=files[0];selectSection(ch,ch.sections[si+1])}
        else if(ci+1<state.chapters.length){var nc=state.chapters[ci+1];state.currentFile=files[0];selectSection(nc,nc.sections[0])}
      }
    }else{
      if(fi>0){loadFile(files[fi-1])}
      else{
        /* First file → last file of prev section */
        if(si>0){state.currentFile=files[files.length-1];selectSection(ch,ch.sections[si-1])}
        else if(ci>0){var pc=state.chapters[ci-1];state.currentFile=files[files.length-1];selectSection(pc,pc.sections[pc.sections.length-1])}
      }
    }
  }
  /* Up/Down: let browser scroll naturally — no preventDefault */
});

/* ══════════════════════════════════════════
   INIT
   ══════════════════════════════════════════ */
loadTree();
</script>
