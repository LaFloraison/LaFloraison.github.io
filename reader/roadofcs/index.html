<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<title>Road of CS · 课程阅读器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --bg-deep:#0a0a1a;--bg-base:#12122a;--bg-surface:#1a1a3a;--bg-hover:#22224a;
  --color-primary:#7c5cfc;--color-primary-light:#9d85fd;--color-primary-glow:rgba(124,92,252,0.4);
  --color-accent:#ffb347;--color-success:#4caf50;
  --text-primary:#e8e8f0;--text-secondary:#a0a0c0;--text-muted:#606080;
  --border-color:rgba(124,92,252,0.2);
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;
  --font-sans:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  --font-mono:"Cascadia Code","Fira Code","JetBrains Mono","Consolas",monospace;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}

html,body{height:100%}
body{
  background:var(--bg-deep);color:var(--text-primary);font-family:var(--font-sans);
  overflow:hidden;-webkit-font-smoothing:antialiased;
}

/* ── Layout ── */
.app{display:flex;height:100vh;height:100dvh}
.sidebar{
  width:300px;min-width:300px;background:var(--bg-base);border-right:1px solid var(--border-color);
  display:flex;flex-direction:column;overflow:hidden;z-index:10;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.sidebar-header{
  padding:1rem 1.2rem;border-bottom:1px solid var(--border-color);
  display:flex;align-items:center;gap:.6rem;flex-shrink:0;
  background:rgba(15,15,35,0.9);backdrop-filter:blur(8px);
}
.sidebar-header .back{color:var(--text-secondary);text-decoration:none;font-size:1.1rem;line-height:1}
.sidebar-header .back:hover{color:var(--color-primary-light)}
.sidebar-header h2{font-size:.95rem;font-weight:600;white-space:nowrap}
.sidebar-tree{flex:1;overflow-y:auto;padding:.5rem 0;-webkit-overflow-scrolling:touch}
.sidebar-tree::-webkit-scrollbar{width:4px}
.sidebar-tree::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:4px}

/* Tree items */
.era-item{border-bottom:1px solid rgba(255,255,255,0.03)}
.era-toggle{
  display:flex;align-items:center;gap:.4rem;padding:.65rem 1.2rem;
  cursor:pointer;font-size:.85rem;font-weight:600;color:var(--text-secondary);
  transition:color .2s,background .2s;user-select:none;border:none;background:none;width:100%;text-align:left;
  font-family:inherit;
}
.era-toggle:hover{color:var(--text-primary);background:var(--bg-hover)}
.era-toggle .arrow{font-size:.6rem;transition:transform .2s;display:inline-block}
.era-toggle.open .arrow{transform:rotate(90deg)}
.era-toggle .era-icon{font-size:1rem}
.era-lessons{max-height:0;overflow:hidden;transition:max-height .35s ease}
.era-lessons.open{max-height:4000px}

.lesson-item{
  display:flex;align-items:center;gap:.5rem;padding:.45rem 1.2rem .45rem 2.4rem;
  cursor:pointer;font-size:.8rem;color:var(--text-secondary);
  transition:color .2s,background .2s;text-decoration:none;
}
.lesson-item:hover{color:var(--text-primary);background:var(--bg-hover)}
.lesson-item.active{color:var(--color-primary-light);background:rgba(124,92,252,0.08);border-right:2px solid var(--color-primary)}
.lesson-item .status{font-size:.65rem}
.lesson-item .num{color:var(--text-muted);font-family:var(--font-mono);font-size:.72rem;min-width:2.2rem}

/* ── Main Content ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  padding:.7rem 1.2rem;border-bottom:1px solid var(--border-color);
  display:flex;align-items:center;gap:.8rem;flex-shrink:0;
  background:rgba(15,15,35,0.9);backdrop-filter:blur(8px);
  flex-wrap:wrap;
}
.menu-btn{
  display:none;background:none;border:none;color:var(--text-secondary);
  font-size:1.3rem;cursor:pointer;padding:4px;line-height:1;
}
.topbar .lesson-title{font-size:.9rem;font-weight:600;flex:1;min-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* File tabs */
.file-tabs{display:flex;gap:4px}
.file-tab{
  padding:5px 14px;border-radius:50px;font-size:.75rem;cursor:pointer;
  border:1px solid var(--border-color);background:transparent;color:var(--text-secondary);
  transition:all .2s;font-family:inherit;white-space:nowrap;touch-action:manipulation;
}
.file-tab:hover{color:var(--text-primary);border-color:var(--color-primary-light)}
.file-tab.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}

/* Content area */
.content{
  flex:1;overflow-y:auto;padding:1.5rem 2rem;-webkit-overflow-scrolling:touch;
}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:6px}

/* Markdown rendered styles */
.rendered{max-width:800px;margin:0 auto}
.rendered h1{font-size:1.8rem;margin:1.5rem 0 1rem;background:linear-gradient(135deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.3}
.rendered h2{font-size:1.35rem;margin:1.8rem 0 .8rem;color:var(--color-primary-light);border-bottom:1px solid var(--border-color);padding-bottom:.4rem}
.rendered h3{font-size:1.1rem;margin:1.4rem 0 .6rem;color:var(--text-primary)}
.rendered p{color:var(--text-secondary);line-height:1.85;margin:.8rem 0;font-size:.95rem}
.rendered strong{color:var(--text-primary)}
.rendered blockquote{
  border-left:3px solid var(--color-primary);margin:1rem 0;padding:.6rem 1rem;
  background:rgba(124,92,252,0.06);border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  color:var(--text-secondary);font-style:italic;
}
.rendered blockquote p{margin:.3rem 0}
.rendered code{
  background:rgba(255,255,255,0.06);padding:2px 6px;border-radius:4px;
  font-family:var(--font-mono);font-size:.85em;color:var(--color-accent-light);
}
.rendered pre{
  background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius-md);
  padding:1rem 1.2rem;overflow-x:auto;margin:1rem 0;font-size:.85rem;line-height:1.6;
}
.rendered pre code{background:none;padding:0;color:var(--text-primary)}
.rendered table{
  border-collapse:collapse;width:100%;margin:1rem 0;font-size:.85rem;
}
.rendered th,.rendered td{
  border:1px solid var(--border-color);padding:.5rem .8rem;text-align:left;
}
.rendered th{background:rgba(124,92,252,0.1);color:var(--color-primary-light);font-weight:600}
.rendered tr:hover{background:rgba(255,255,255,0.02)}
.rendered ul,.rendered ol{padding-left:1.5rem;margin:.6rem 0;color:var(--text-secondary);line-height:1.8}
.rendered li{margin:.2rem 0}
.rendered hr{border:none;border-top:1px solid var(--border-color);margin:2rem 0}
.rendered a{color:var(--color-primary-light);text-decoration:underline}
.rendered img{max-width:100%;border-radius:var(--radius-md)}
/* Mermaid */
.rendered .mermaid{background:var(--bg-surface);border-radius:var(--radius-md);padding:1rem;margin:1rem 0;overflow-x:auto}
.rendered .mermaid svg{max-width:100%}

/* Empty state */
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;color:var(--text-muted);text-align:center;padding:2rem;
}
.empty-state .icon{font-size:3rem;margin-bottom:1rem}
.empty-state h3{font-size:1.1rem;margin-bottom:.5rem;color:var(--text-secondary)}
.empty-state p{font-size:.9rem}

/* Loading */
.loader{text-align:center;padding:3rem;color:var(--text-muted)}
.loader .spinner{
  display:inline-block;width:32px;height:32px;border:3px solid var(--border-color);
  border-top-color:var(--color-primary);border-radius:50%;
  animation:spin .8s linear infinite;margin-bottom:.8rem;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Error banner */
.error-banner{
  background:rgba(244,67,54,0.1);border:1px solid rgba(244,67,54,0.3);
  border-radius:var(--radius-sm);padding:.8rem 1rem;margin:1rem 0;
  color:#f44336;font-size:.85rem;
}

/* ── Sidebar overlay (mobile) ── */
.sidebar-overlay{
  display:none;position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.5);z-index:9;
}

/* ── YAML frontmatter box ── */
.meta-box{
  background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius-md);
  padding:.8rem 1rem;margin-bottom:1.5rem;font-size:.8rem;color:var(--text-muted);
  display:flex;flex-wrap:wrap;gap:.8rem 1.5rem;
}
.meta-box .meta-item{display:flex;align-items:center;gap:4px}
.meta-box .meta-label{color:var(--text-secondary);font-weight:600}

/* ── Mobile ── */
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);z-index:20;width:280px;min-width:280px}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.active{display:block}
  .menu-btn{display:inline-block}
  .content{padding:1rem}
  .rendered h1{font-size:1.4rem}
  .rendered h2{font-size:1.15rem}
  .file-tab{padding:4px 10px;font-size:.7rem}
}
@media(max-width:400px){
  .sidebar{width:100%;min-width:100%}
  .topbar{padding:.5rem .8rem;gap:.5rem}
  .topbar .lesson-title{font-size:.8rem}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <div class="sidebar-overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="../../" class="back" title="返回门户">←</a>
      <h2>⚛️ Road of CS</h2>
    </div>
    <div class="sidebar-tree" id="tree"></div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" title="目录">☰</button>
      <span class="lesson-title" id="lessonTitle">选择一节课开始</span>
      <div class="file-tabs" id="fileTabs"></div>
    </div>
    <div class="content" id="content">
      <div class="empty-state">
        <div class="icon">📖</div>
        <h3>欢迎来到 Road of CS</h3>
        <p>从左侧选择一节课开始阅读<br>408 计算机 · AI 历史精神漫游</p>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
/* ══════════════════════════════════════════
   CONFIG
   ══════════════════════════════════════════ */
var CONFIG = {
  repo:'LaFloraison/RoadOfCS',
  branch:'main',
  curriculumPath:'curriculum/408-history/curriculum-design.md',
  lessonsDir:'lessons/408-history',
  // File types available for each lesson
  fileTypes:[
    {id:'主线',label:'主线',icon:'📜'},
    {id:'前沿',label:'前沿',icon:'🚀'},
    {id:'习题',label:'习题',icon:'✏️'},
    {id:'镜鉴',label:'镜鉴',icon:'🪞'}
  ],
  deepDivePattern:/^[FPA]\d|^硬件|^系统|^理论/  // Patterns for deep-dive files
};

var state = {
  eras:[],          // Parsed curriculum tree
  currentLesson:null, // {eraIdx, lessonIdx, lesson}
  currentFile:'主线',
  lessonFolders:{}, // Maps "X.Y" → actual folder name (from GitHub API)
  generatedLessons:{} // Cache: "era-lesson" → true/false
};

/* ── DOM refs ── */
var sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay');
var treeEl=document.getElementById('tree'),contentEl=document.getElementById('content');
var lessonTitle=document.getElementById('lessonTitle'),fileTabs=document.getElementById('fileTabs');
var menuBtn=document.getElementById('menuBtn');

/* ── Mobile menu ── */
menuBtn.addEventListener('click',function(){sidebar.classList.toggle('open');overlay.classList.toggle('active')});
overlay.addEventListener('click',function(){sidebar.classList.remove('open');overlay.classList.remove('active')});
function closeMenu(){sidebar.classList.remove('open');overlay.classList.remove('active')}

/* ══════════════════════════════════════════
   PARSE CURRICULUM
   ══════════════════════════════════════════ */
function parseCurriculum(text){
  var eras=[],currentEra=null;
  var lines=text.split('\n');
  var eraRe=/^##\s+时代(\d+)[：:]\s*(.+)/;
  var lessonRe=/^###\s+(?:\[预备\]\s*)?(\d+)\.(\d+)\s+(.+)/;

  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    var em=line.match(eraRe);
    if(em){
      if(currentEra)eras.push(currentEra);
      currentEra={num:parseInt(em[1]),title:em[2].trim(),lessons:[]};
      continue;
    }
    var lm=line.match(lessonRe);
    if(lm && currentEra){
      currentEra.lessons.push({
        eraNum:parseInt(lm[1]),
        lessonNum:parseInt(lm[2]),
        id:lm[1]+'.'+lm[2],
        title:lm[3].trim(),
        isPrep:line.indexOf('[预备]')>=0,
        isOptional:line.indexOf('选读')>=0||line.indexOf('★')>=0
      });
    }
  }
  if(currentEra)eras.push(currentEra);
  return eras;
}

/* ══════════════════════════════════════════
   RENDER TREE
   ══════════════════════════════════════════ */
var ERA_ICONS=['🔢','💡','⚡','🔌','💻','🌐','🤖','🧬','🚀','🌌'];

function renderTree(){
  var html='';
  for(var ei=0;ei<state.eras.length;ei++){
    var era=state.eras[ei];
    html+='<div class="era-item">'+
      '<button class="era-toggle" data-era="'+ei+'">'+
        '<span class="arrow">▶</span> '+
        '<span class="era-icon">'+(ERA_ICONS[era.num]||'📂')+'</span> '+
        '时代'+era.num+'：'+era.title+
      '</button>'+
      '<div class="era-lessons" data-era-list="'+ei+'">';
    for(var li=0;li<era.lessons.length;li++){
      var l=era.lessons[li];
      var prefix=l.isPrep?'[预] ':l.isOptional?'[选] ':'';
      var status='⏳';
      var key=l.id;
      if(state.generatedLessons[key]!==undefined){
        status=state.generatedLessons[key]?'✅':'⏳';
      }
      html+='<div class="lesson-item" data-era="'+ei+'" data-lesson="'+li+'" data-id="'+l.id+'">'+
        '<span class="num">'+l.id+'</span>'+
        '<span class="status">'+status+'</span> '+
        '<span>'+prefix+l.title+'</span>'+
      '</div>';
    }
    html+='</div></div>';
  }
  treeEl.innerHTML=html;

  /* Click handlers */
  treeEl.querySelectorAll('.era-toggle').forEach(function(btn){
    btn.addEventListener('click',function(){
      var ei=this.dataset.era;
      var list=treeEl.querySelector('[data-era-list="'+ei+'"]');
      this.classList.toggle('open');
      list.classList.toggle('open');
    });
  });
  treeEl.querySelectorAll('.lesson-item').forEach(function(item){
    item.addEventListener('click',function(){
      var ei=parseInt(this.dataset.era),li=parseInt(this.dataset.lesson);
      selectLesson(ei,li);
      closeMenu();
    });
  });
}

/* ══════════════════════════════════════════
   DETECT ACTUAL LESSON FOLDERS (GitHub API)
   ══════════════════════════════════════════ */
function scanLessonFolders(){
  var apiUrl='https://api.github.com/repos/'+CONFIG.repo+'/contents/'+CONFIG.lessonsDir+'?ref='+CONFIG.branch;
  return fetch(apiUrl,{headers:{'Accept':'application/vnd.github.v3+json'}})
    .then(function(r){if(!r.ok)throw new Error('API '+r.status);return r.json()})
    .then(function(items){
      state.lessonFolders={};
      for(var i=0;i<items.length;i++){
        if(items[i].type!=='dir')continue;
        var name=items[i].name;
        /* Extract lesson ID from folder name "第X.Y节-..." */
        var m=name.match(/^第(\d+\.\d+)节/);
        if(m){
          state.lessonFolders[m[1]]=name;
          state.generatedLessons[m[1]]=true;
        }
      }
    })
    .catch(function(e){
      console.warn('GitHub API folder scan failed:',e.message);
      /* Fallback: empty, will try constructed names */
    });
}

/* ══════════════════════════════════════════
   GET FOLDER NAME (mapping or fallback)
   ══════════════════════════════════════════ */
function getFolderName(lesson){
  /* Use API-discovered folder name if available */
  if(state.lessonFolders[lesson.id])return state.lessonFolders[lesson.id];

  /* Fallback: construct from title */
  var short=lesson.title;
  var dash=short.indexOf('——');
  if(dash>0)short=short.substring(0,dash);
  if(short.charAt(short.length-1)==='？')short=short.slice(0,-1);
  return '第'+lesson.id+'节-'+short;
}

/* ══════════════════════════════════════════
   LOAD CURRICULUM
   ══════════════════════════════════════════ */
function loadCurriculum(){
  treeEl.innerHTML='<div class="loader"><div class="spinner"></div><p>加载课程结构…</p></div>';
  var url='https://raw.githubusercontent.com/'+CONFIG.repo+'/'+CONFIG.branch+'/'+CONFIG.curriculumPath;

  /* Fetch curriculum + folder listing in parallel */
  Promise.all([
    fetch(url).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}),
    scanLessonFolders()
  ])
    .then(function(results){
      var text=results[0];
      state.eras=parseCurriculum(text);
      renderTree();
      /* Refresh tree to show detected generated lessons */
      var firstToggle=treeEl.querySelector('.era-toggle');
      if(firstToggle)firstToggle.click();
    })
    .catch(function(e){
      treeEl.innerHTML='<div class="error-banner">加载课程结构失败: '+e.message+
        '<br><small>请检查网络连接后刷新页面</small></div>';
    });
}

/* ══════════════════════════════════════════
   SELECT LESSON & LOAD FILE
   ══════════════════════════════════════════ */
function selectLesson(eraIdx,lessonIdx){
  var era=state.eras[eraIdx];
  var lesson=era.lessons[lessonIdx];
  state.currentLesson={eraIdx:eraIdx,lessonIdx:lessonIdx,lesson:lesson,era:era};

  /* Update sidebar active */
  treeEl.querySelectorAll('.lesson-item').forEach(function(el){el.classList.remove('active')});
  var activeEl=treeEl.querySelector('[data-era="'+eraIdx+'"][data-lesson="'+lessonIdx+'"]');
  if(activeEl)activeEl.classList.add('active');

  /* Update title */
  lessonTitle.textContent=lesson.id+' '+lesson.title;

  /* Render file tabs */
  renderFileTabs(lesson.id);

  /* Load file */
  loadFile('主线');
}

function renderFileTabs(lessonId){
  var html='';
  for(var i=0;i<CONFIG.fileTypes.length;i++){
    var ft=CONFIG.fileTypes[i];
    var active=ft.id===state.currentFile?' active':'';
    html+='<button class="file-tab'+active+'" data-file="'+ft.id+'">'+ft.icon+' '+ft.label+'</button>';
  }
  fileTabs.innerHTML=html;

  fileTabs.querySelectorAll('.file-tab').forEach(function(btn){
    btn.addEventListener('click',function(){
      loadFile(this.dataset.file);
    });
  });
}

function loadFile(fileId){
  state.currentFile=fileId;
  /* Update tab active */
  fileTabs.querySelectorAll('.file-tab').forEach(function(t){
    t.classList.toggle('active',t.dataset.file===fileId);
  });

  var lesson=state.currentLesson.lesson;
  var folderName=encodeURIComponent(getFolderName(lesson));
  var fileName=encodeURIComponent(fileId+'.md');
  var url='https://raw.githubusercontent.com/'+CONFIG.repo+'/'+CONFIG.branch+'/'+
    CONFIG.lessonsDir+'/'+folderName+'/'+fileName;

  contentEl.innerHTML='<div class="loader"><div class="spinner"></div><p>加载中…</p></div>';

  fetch(url)
    .then(function(r){if(!r.ok)throw new Error('文件不存在 ('+r.status+')');return r.text()})
    .then(function(md){
      state.generatedLessons[lesson.id]=true;
      renderMarkdown(md,lesson);
      /* Update tree status */
      var item=treeEl.querySelector('[data-id="'+lesson.id+'"] .status');
      if(item)item.textContent='✅';
    })
    .catch(function(e){
      state.generatedLessons[lesson.id]=false;
      contentEl.innerHTML='<div class="empty-state">'+
        '<div class="icon">🔮</div>'+
        '<h3>这节课还没有生成</h3>'+
        '<p>'+lesson.id+' '+lesson.title+'<br>课程内容将在未来生成。请先阅读已生成的课程。</p>'+
        '<p style="font-size:.8rem;margin-top:.5rem;color:var(--text-muted)">('+e.message+')</p>'+
      '</div>';
    });
}

/* ══════════════════════════════════════════
   RENDER MARKDOWN
   ══════════════════════════════════════════ */
function renderMarkdown(md,lesson){
  /* Parse YAML frontmatter */
  var body=md,meta={};
  if(md.indexOf('---')===0){
    var end=md.indexOf('---',3);
    if(end>0){
      var fm=md.substring(3,end).trim();
      body=md.substring(end+3).trim();
      /* Simple YAML parser for our known format */
      fm.split('\n').forEach(function(line){
        var ci=line.indexOf(':');
        if(ci>0){
          var k=line.substring(0,ci).trim();
          var v=line.substring(ci+1).trim();
          /* Remove quotes */
          v=v.replace(/^['"]|['"]$/g,'');
          /* Remove brackets from arrays */
          v=v.replace(/^\[|\]$/g,'');
          meta[k]=v;
        }
      });
    }
  }

  /* Build meta box HTML */
  var metaHtml='';
  if(Object.keys(meta).length>0){
    metaHtml='<div class="meta-box">';
    if(meta.era)metaHtml+='<span class="meta-item"><span class="meta-label">时代</span> '+esc(meta.era)+'</span>';
    if(meta.subjects)metaHtml+='<span class="meta-item"><span class="meta-label">科目</span> '+esc(meta.subjects)+'</span>';
    if(meta.philosophy_thread)metaHtml+='<span class="meta-item"><span class="meta-label">哲学主线</span> '+esc(meta.philosophy_thread)+'</span>';
    if(meta.date)metaHtml+='<span class="meta-item"><span class="meta-label">日期</span> '+esc(meta.date)+'</span>';
    metaHtml+='</div>';
  }

  /* Render with marked */
  var html=metaHtml;
  try{
    if(typeof marked!=='undefined'){
      marked.setOptions({breaks:true,gfm:true});
      html+=marked.parse(body);
    }else{
      html+='<div class="error-banner">Markdown 渲染器未加载，请刷新页面</div><pre>'+esc(body)+'</pre>';
    }
  }catch(e){
    html+='<div class="error-banner">渲染错误: '+esc(e.message)+'</div><pre>'+esc(body)+'</pre>';
  }

  contentEl.innerHTML='<div class="rendered">'+html+'</div>';

  /* Render mermaid diagrams if present */
  if(typeof mermaid!=='undefined'){
    try{mermaid.run({querySelector:'.mermaid'})}catch(e){}
  }
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* ══════════════════════════════════════════
   KEYBOARD NAVIGATION
   ══════════════════════════════════════════ */
document.addEventListener('keydown',function(e){
  if(!state.currentLesson)return;
  var era=state.currentLesson.era,lesson=state.currentLesson.lesson;
  var ei=state.currentLesson.eraIdx,li=state.currentLesson.lessonIdx;

  /* File switching */
  if(e.key==='1')loadFile('主线');
  if(e.key==='2')loadFile('前沿');
  if(e.key==='3')loadFile('习题');
  if(e.key==='4')loadFile('镜鉴');

  /* Navigate lessons */
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){
    e.preventDefault();
    var nextLi=li+1;
    var nextEi=ei;
    /* Check if next lesson exists in current era */
    if(nextLi>=era.lessons.length){
      /* Move to next era */
      nextEi=ei+1;
      nextLi=0;
      if(nextEi>=state.eras.length)return;
    }
    selectLesson(nextEi,nextLi);
    /* Expand era if needed */
    expandEra(nextEi);
  }
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){
    e.preventDefault();
    var prevLi=li-1;
    var prevEi=ei;
    if(prevLi<0){
      prevEi=ei-1;
      if(prevEi<0)return;
      prevLi=state.eras[prevEi].lessons.length-1;
    }
    selectLesson(prevEi,prevLi);
    expandEra(prevEi);
  }
});

function expandEra(ei){
  var toggle=treeEl.querySelector('.era-toggle[data-era="'+ei+'"]');
  var list=treeEl.querySelector('.era-lessons[data-era-list="'+ei+'"]');
  if(toggle&&!toggle.classList.contains('open')){
    toggle.classList.add('open');
    list.classList.add('open');
  }
}

/* ══════════════════════════════════════════
   INIT
   ══════════════════════════════════════════ */
loadCurriculum();
/* Auto-load lesson 0.1 after curriculum loads */
var origRender=renderTree;
renderTree=function(){
  origRender();
  /* Check URL hash for lesson */
  var hash=window.location.hash;
  if(hash&&hash.indexOf('#')===0){
    var targetId=hash.substring(1);
    /* Find lesson by id */
    for(var ei=0;ei<state.eras.length;ei++){
      for(var li=0;li<state.eras[ei].lessons.length;li++){
        if(state.eras[ei].lessons[li].id===targetId){
          selectLesson(ei,li);
          expandEra(ei);
          return;
        }
      }
    }
  }
  /* Default: open first generated lesson */
  if(state.eras.length>0&&state.eras[0].lessons.length>0){
    selectLesson(0,0);
    expandEra(0);
  }
};
</script>
