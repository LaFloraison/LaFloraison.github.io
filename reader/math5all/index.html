<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<title>Math5All · 课程阅读器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --bg-deep:#0a0a1a;--bg-base:#12122a;--bg-surface:#1a1a3a;--bg-hover:#22224a;
  --color-primary:#059669;--color-primary-light:#34d399;--color-primary-glow:rgba(5,150,105,0.4);
  --color-accent:#f59e0b;
  --text-primary:#e8e8f0;--text-secondary:#a0a0c0;--text-muted:#606080;
  --border-color:rgba(5,150,105,0.2);
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;
  --font-sans:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  --font-mono:"Cascadia Code","Fira Code","JetBrains Mono","Consolas",monospace;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}

html,body{height:100%}
body{
  background:var(--bg-deep);color:var(--text-primary);font-family:var(--font-sans);
  overflow:hidden;-webkit-font-smoothing:antialiased;
}

/* ── Layout ── */
.app{display:flex;height:100vh;height:100dvh}
.sidebar{
  width:300px;min-width:300px;background:var(--bg-base);border-right:1px solid var(--border-color);
  display:flex;flex-direction:column;overflow:hidden;z-index:10;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.sidebar-header{
  padding:1rem 1.2rem;border-bottom:1px solid var(--border-color);
  display:flex;align-items:center;gap:.6rem;flex-shrink:0;
  background:rgba(15,15,35,0.9);backdrop-filter:blur(8px);
}
.sidebar-header .back{color:var(--text-secondary);text-decoration:none;font-size:1.1rem}
.sidebar-header h2{font-size:.95rem;font-weight:600}
.sidebar-tree{flex:1;overflow-y:auto;padding:.5rem 0;-webkit-overflow-scrolling:touch}
.sidebar-tree::-webkit-scrollbar{width:4px}
.sidebar-tree::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:4px}

/* Tree */
.lesson-item{
  display:flex;align-items:center;gap:.5rem;padding:.55rem 1.2rem;
  cursor:pointer;font-size:.82rem;color:var(--text-secondary);
  transition:color .2s,background .2s;border-left:3px solid transparent;
}
.lesson-item:hover{color:var(--text-primary);background:var(--bg-hover)}
.lesson-item.active{color:var(--color-primary-light);background:rgba(5,150,105,0.08);border-left-color:var(--color-primary)}
.lesson-item .num{color:var(--text-muted);font-family:var(--font-mono);font-size:.72rem;min-width:3rem}
.lesson-item .status{font-size:.65rem}

/* ── Main Content ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  padding:.7rem 1.2rem;border-bottom:1px solid var(--border-color);
  display:flex;align-items:center;gap:.8rem;flex-shrink:0;
  background:rgba(15,15,35,0.9);backdrop-filter:blur(8px);flex-wrap:wrap;
}
.menu-btn{
  display:none;background:none;border:none;color:var(--text-secondary);
  font-size:1.3rem;cursor:pointer;padding:4px;
}
.topbar .lesson-title{font-size:.9rem;font-weight:600;flex:1;min-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.file-tabs{display:flex;gap:4px}
.file-tab{
  padding:5px 14px;border-radius:50px;font-size:.75rem;cursor:pointer;
  border:1px solid var(--border-color);background:transparent;color:var(--text-secondary);
  transition:all .2s;font-family:inherit;white-space:nowrap;touch-action:manipulation;
}
.file-tab:hover{color:var(--text-primary);border-color:var(--color-primary-light)}
.file-tab.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}

.content{
  flex:1;overflow-y:auto;padding:1.5rem 2rem;-webkit-overflow-scrolling:touch;
}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:6px}

/* Markdown rendered styles — reuse same pattern as RoadOfCS reader */
.rendered{max-width:800px;margin:0 auto}
.rendered h1{font-size:1.8rem;margin:1.5rem 0 1rem;background:linear-gradient(135deg,#34d399,#059669);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.3}
.rendered h2{font-size:1.35rem;margin:1.8rem 0 .8rem;color:var(--color-primary-light);border-bottom:1px solid var(--border-color);padding-bottom:.4rem}
.rendered h3{font-size:1.1rem;margin:1.4rem 0 .6rem;color:var(--text-primary)}
.rendered p{color:var(--text-secondary);line-height:1.85;margin:.8rem 0;font-size:.95rem}
.rendered strong{color:var(--text-primary)}
.rendered blockquote{
  border-left:3px solid var(--color-primary);margin:1rem 0;padding:.6rem 1rem;
  background:rgba(5,150,105,0.06);border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  color:var(--text-secondary);font-style:italic;
}
.rendered blockquote p{margin:.3rem 0}
.rendered code{
  background:rgba(255,255,255,0.06);padding:2px 6px;border-radius:4px;
  font-family:var(--font-mono);font-size:.85em;color:var(--color-accent);
}
.rendered pre{
  background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius-md);
  padding:1rem 1.2rem;overflow-x:auto;margin:1rem 0;font-size:.85rem;line-height:1.6;
}
.rendered pre code{background:none;padding:0;color:var(--text-primary)}
.rendered table{
  border-collapse:collapse;width:100%;margin:1rem 0;font-size:.85rem;
}
.rendered th,.rendered td{border:1px solid var(--border-color);padding:.5rem .8rem;text-align:left}
.rendered th{background:rgba(5,150,105,0.1);color:var(--color-primary-light);font-weight:600}
.rendered tr:hover{background:rgba(255,255,255,0.02)}
.rendered ul,.rendered ol{padding-left:1.5rem;margin:.6rem 0;color:var(--text-secondary);line-height:1.8}
.rendered li{margin:.2rem 0}
.rendered hr{border:none;border-top:1px solid var(--border-color);margin:2rem 0}
.rendered a{color:var(--color-primary-light);text-decoration:underline}
.rendered img{max-width:100%;border-radius:var(--radius-md)}
.rendered .mermaid{background:var(--bg-surface);border-radius:var(--radius-md);padding:1rem;margin:1rem 0;overflow-x:auto}

.empty-state,.loader{text-align:center;padding:3rem;color:var(--text-muted)}
.loader .spinner{
  display:inline-block;width:32px;height:32px;border:3px solid var(--border-color);
  border-top-color:var(--color-primary);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:.8rem;
}
@keyframes spin{to{transform:rotate(360deg)}}
.error-banner{
  background:rgba(244,67,54,0.1);border:1px solid rgba(244,67,54,0.3);
  border-radius:var(--radius-sm);padding:.8rem 1rem;margin:1rem 0;color:#f44336;font-size:.85rem;
}

.sidebar-overlay{
  display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9;
}
.meta-box{
  background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius-md);
  padding:.8rem 1rem;margin-bottom:1.5rem;font-size:.8rem;color:var(--text-muted);
  display:flex;flex-wrap:wrap;gap:.8rem 1.5rem;
}
.meta-box .meta-label{color:var(--text-secondary);font-weight:600}

/* ── Mobile ── */
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);z-index:20;width:280px;min-width:280px}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.active{display:block}
  .menu-btn{display:inline-block}
  .content{padding:1rem}
  .rendered h1{font-size:1.4rem}
}
@media(max-width:400px){.sidebar{width:100%;min-width:100%}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar-overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="../../" class="back" title="返回门户">←</a>
      <h2>📐 Math5All</h2>
    </div>
    <div class="sidebar-tree" id="tree"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" title="目录">☰</button>
      <span class="lesson-title" id="lessonTitle">选择一节课开始</span>
      <div class="file-tabs" id="fileTabs"></div>
    </div>
    <div class="content" id="content">
      <div class="empty-state">
        <div class="icon" style="font-size:3rem">📐</div>
        <h3>欢迎来到 Math5All</h3>
        <p>从左侧选择一节课开始阅读<br>以数学为脊柱的整合式学习</p>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
/* ══════════════════════════════════════════
   CONFIG
   ══════════════════════════════════════════ */
var CONFIG = {
  repo:'LaFloraison/Math5All',
  branch:'main',
  lessonsDir:'lessons/calculus',
  // Math5All file types
  fileTypes:[
    {id:'数学',label:'数学',icon:'📐'},
    {id:'应用',label:'应用',icon:'🔗'},
    {id:'习题',label:'习题',icon:'✏️'},
    {id:'谜镜',label:'谜镜',icon:'🪞'}
  ]
};

var state = {
  lessons:[],          // [{folderName, displayName, files:[]}]
  currentIdx:-1,
  currentFile:'数学'
};

/* ── DOM ── */
var sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay');
var treeEl=document.getElementById('tree'),contentEl=document.getElementById('content');
var lessonTitle=document.getElementById('lessonTitle'),fileTabs=document.getElementById('fileTabs');
var menuBtn=document.getElementById('menuBtn');

menuBtn.addEventListener('click',function(){sidebar.classList.toggle('open');overlay.classList.toggle('active')});
overlay.addEventListener('click',function(){sidebar.classList.remove('open');overlay.classList.remove('active')});
function closeMenu(){sidebar.classList.remove('open');overlay.classList.remove('active')}

/* ══════════════════════════════════════════
   LOAD LESSONS LIST (via GitHub API)
   ══════════════════════════════════════════ */
function loadLessons(){
  treeEl.innerHTML='<div class="loader"><div class="spinner"></div><p>加载课程列表…</p></div>';

  /* Use GitHub Contents API to list lesson directories */
  var apiUrl='https://api.github.com/repos/'+CONFIG.repo+'/contents/'+CONFIG.lessonsDir+'?ref='+CONFIG.branch;

  fetch(apiUrl,{headers:{'Accept':'application/vnd.github.v3+json'}})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
    .then(function(items){
      /* Filter directories only */
      state.lessons=[];
      for(var i=0;i<items.length;i++){
        if(items[i].type==='dir'){
          state.lessons.push({
            folderName:items[i].name,
            displayName:formatLessonName(items[i].name),
            url:items[i].url
          });
        }
      }
      /* Sort naturally */
      state.lessons.sort(function(a,b){
        return a.folderName.localeCompare(b.folderName,'zh');
      });

      renderTree();
      /* Auto-load first lesson */
      if(state.lessons.length>0){
        selectLesson(0);
      }
    })
    .catch(function(e){
      treeEl.innerHTML='<div class="error-banner">加载课程列表失败: '+e.message+
        '<br><small>GitHub API 限制: 60次/小时 (未认证)。如果超限请稍后再试。</small></div>';
    });
}

/* Parse folder names like "第01节-P1-Associativity-of-Addition" */
function formatLessonName(name){
  var parts=name.split('-');
  if(parts.length>=2){
    var num=parts[0].replace('第','').replace('节','');
    var prop=parts[1]; // e.g. P1
    var title=parts.slice(2).join(' ').replace(/-/g,' ');
    return prop+' · '+title;
  }
  return name.replace(/-/g,' ');
}

/* ══════════════════════════════════════════
   RENDER TREE
   ══════════════════════════════════════════ */
function renderTree(){
  var html='';
  for(var i=0;i<state.lessons.length;i++){
    var l=state.lessons[i];
    var active=i===state.currentIdx?' active':'';
    var num=l.folderName.match(/第(\d+)节/);
    var numStr=num?num[1]:String(i+1);
    html+='<div class="lesson-item'+active+'" data-idx="'+i+'">'+
      '<span class="num">'+numStr+'</span>'+
      '<span class="status">✅</span> '+
      '<span>'+esc(l.displayName)+'</span>'+
    '</div>';
  }
  treeEl.innerHTML=html;

  treeEl.querySelectorAll('.lesson-item').forEach(function(item){
    item.addEventListener('click',function(){
      selectLesson(parseInt(this.dataset.idx));
      closeMenu();
    });
  });
}

/* ══════════════════════════════════════════
   SELECT & LOAD
   ══════════════════════════════════════════ */
function selectLesson(idx){
  state.currentIdx=idx;
  var lesson=state.lessons[idx];

  /* Update active */
  treeEl.querySelectorAll('.lesson-item').forEach(function(el,i){
    el.classList.toggle('active',i===idx);
  });

  lessonTitle.textContent=lesson.displayName;
  renderFileTabs();
  loadFile('数学');
}

function renderFileTabs(){
  var html='';
  for(var i=0;i<CONFIG.fileTypes.length;i++){
    var ft=CONFIG.fileTypes[i];
    var active=ft.id===state.currentFile?' active':'';
    html+='<button class="file-tab'+active+'" data-file="'+ft.id+'">'+ft.icon+' '+ft.label+'</button>';
  }
  fileTabs.innerHTML=html;

  fileTabs.querySelectorAll('.file-tab').forEach(function(btn){
    btn.addEventListener('click',function(){
      loadFile(this.dataset.file);
    });
  });
}

function loadFile(fileId){
  state.currentFile=fileId;
  /* Update tabs */
  fileTabs.querySelectorAll('.file-tab').forEach(function(t){
    t.classList.toggle('active',t.dataset.file===fileId);
  });

  var lesson=state.lessons[state.currentIdx];
  var folderName=encodeURIComponent(lesson.folderName);
  var fileName=encodeURIComponent(fileId+'.md');
  var url='https://raw.githubusercontent.com/'+CONFIG.repo+'/'+CONFIG.branch+'/'+
    CONFIG.lessonsDir+'/'+folderName+'/'+fileName;

  contentEl.innerHTML='<div class="loader"><div class="spinner"></div><p>加载中…</p></div>';

  fetch(url)
    .then(function(r){if(!r.ok)throw new Error('文件不存在 ('+r.status+')');return r.text()})
    .then(function(md){renderMarkdown(md)})
    .catch(function(e){
      contentEl.innerHTML='<div class="empty-state">'+
        '<div class="icon" style="font-size:2.5rem">📝</div>'+
        '<h3>这个文件还没有生成</h3>'+
        '<p>'+fileId+'.md<br>即将生成，敬请期待。</p>'+
        '<p style="font-size:.8rem;margin-top:.5rem;color:var(--text-muted)">'+esc(e.message)+'</p>'+
      '</div>';
    });
}

/* ══════════════════════════════════════════
   RENDER MARKDOWN
   ══════════════════════════════════════════ */
function renderMarkdown(md){
  /* Parse YAML frontmatter */
  var body=md,meta={};
  if(md.indexOf('---')===0){
    var end=md.indexOf('---',3);
    if(end>0){
      var fm=md.substring(3,end).trim();
      body=md.substring(end+3).trim();
      fm.split('\n').forEach(function(line){
        var ci=line.indexOf(':');
        if(ci>0){
          var k=line.substring(0,ci).trim();
          var v=line.substring(ci+1).trim().replace(/^['"]|['"]$/g,'');
          meta[k]=v;
        }
      });
    }
  }

  var metaHtml='';
  if(Object.keys(meta).length>0){
    metaHtml='<div class="meta-box">';
    if(meta.course)metaHtml+='<span class="meta-item"><span class="meta-label">课程</span> '+esc(meta.course)+'</span>';
    if(meta.date)metaHtml+='<span class="meta-item"><span class="meta-label">日期</span> '+esc(meta.date)+'</span>';
    if(meta.prop)metaHtml+='<span class="meta-item"><span class="meta-label">命题</span> '+esc(meta.prop)+'</span>';
    metaHtml+='</div>';
  }

  var html=metaHtml;
  try{
    if(typeof marked!=='undefined'){
      marked.setOptions({breaks:true,gfm:true});
      html+=marked.parse(body);
    }else{
      html+='<div class="error-banner">Markdown 渲染器未加载</div>';
    }
  }catch(e){
    html+='<div class="error-banner">渲染错误: '+esc(e.message)+'</div>';
  }

  contentEl.innerHTML='<div class="rendered">'+html+'</div>';
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* ══════════════════════════════════════════
   KEYBOARD
   ══════════════════════════════════════════ */
document.addEventListener('keydown',function(e){
  if(state.currentIdx<0)return;
  if(e.key==='1')loadFile('数学');
  if(e.key==='2')loadFile('应用');
  if(e.key==='3')loadFile('习题');
  if(e.key==='4')loadFile('谜镜');
  if((e.key==='ArrowRight'||e.key==='ArrowDown')&&state.currentIdx<state.lessons.length-1){
    e.preventDefault();selectLesson(state.currentIdx+1);
  }
  if((e.key==='ArrowLeft'||e.key==='ArrowUp')&&state.currentIdx>0){
    e.preventDefault();selectLesson(state.currentIdx-1);
  }
});

/* ══════════════════════════════════════════
   INIT
   ══════════════════════════════════════════ */
loadLessons();
</script>
</body>
</html>
