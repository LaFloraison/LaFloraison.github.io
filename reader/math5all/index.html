<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<title>Math5All · 课程阅读器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ══════ Blue Topaz inspired color scheme ══════ */
:root{
  --bg-primary:#1e1e1e;
  --bg-secondary:#181818;
  --bg-surface:#252525;
  --bg-hover:#2d2d2d;
  --bg-code:#1a1a2e;
  --color-accent:#2d82cc;
  --color-accent-light:#4993d4;
  --color-accent-soft:rgba(45,130,204,0.15);
  --color-accent-glow:rgba(45,130,204,0.08);
  --text-normal:#c6c6c6;
  --text-soft:#a0a0a0;
  --text-muted:#7a7a7a;
  --text-faint:#5a5a5a;
  --border-subtle:rgba(255,255,255,0.06);
  --border-normal:rgba(255,255,255,0.09);
  --border-visible:rgba(255,255,255,0.14);
  --radius-s:5px;
  --radius-m:7px;
  --radius-l:15px;
  --font-text:Bookerly,'Inter',"Segoe UI","霞鹜文楷 GB","LXGW WenKai","Microsoft YaHei",sans-serif;
  --font-mono:'JetBrains Mono',Consolas,Monaco,"等距更纱黑体 SC","Microsoft YaHei",monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --h1-size:1.5625em;
  --h2-size:1.4375em;
  --h3-size:1.3125em;
  --h4-size:1.1875em;
}

html,body{height:100%}
body{
  background:var(--bg-primary);color:var(--text-normal);
  font-family:var(--font-text);font-size:18px;
  overflow:hidden;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ── Layout ── */
.app{display:flex;height:100vh;height:100dvh}
.sidebar{
  width:280px;min-width:280px;background:var(--bg-secondary);
  border-right:1px solid var(--border-subtle);
  display:flex;flex-direction:column;overflow:hidden;z-index:10;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.sidebar-header{
  padding:.9rem 1.1rem;border-bottom:1px solid var(--border-subtle);
  display:flex;align-items:center;gap:.5rem;flex-shrink:0;
  background:var(--bg-secondary);
}
.sidebar-header .back{color:var(--text-muted);text-decoration:none;font-size:1rem}
.sidebar-header h2{font-size:.9rem;font-weight:600;color:var(--text-normal)}
.sidebar-tree{flex:1;overflow-y:auto;padding:.3rem 0;-webkit-overflow-scrolling:touch}
.sidebar-tree::-webkit-scrollbar{width:4px}
.sidebar-tree::-webkit-scrollbar-thumb{background:var(--border-visible);border-radius:4px}

/* Tree */
.lesson-item{
  display:flex;align-items:center;gap:.4rem;padding:.4rem 1.1rem;
  cursor:pointer;font-size:.78rem;color:var(--text-muted);
  transition:color .15s,background .15s;border-left:3px solid transparent;
}
.lesson-item:hover{color:var(--text-normal);background:var(--bg-hover)}
.lesson-item.active{color:var(--color-accent-light);background:var(--color-accent-glow);border-left-color:var(--color-accent)}
.lesson-item .num{color:var(--text-faint);font-family:var(--font-mono);font-size:.68rem;min-width:2.5rem}
.lesson-item .status{font-size:.6rem}

/* ── Main Content ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg-primary)}
.topbar{
  padding:.6rem 1.2rem;border-bottom:1px solid var(--border-subtle);
  display:flex;align-items:center;gap:.7rem;flex-shrink:0;
  background:var(--bg-secondary);flex-wrap:wrap;
}
.menu-btn{display:none;background:none;border:none;color:var(--text-muted);font-size:1.2rem;cursor:pointer;padding:4px}
.topbar .lesson-title{font-size:.85rem;font-weight:600;flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-normal)}

/* File tabs */
.file-tabs{display:flex;gap:2px;background:var(--bg-hover);border-radius:var(--radius-m);padding:3px}
.file-tab{
  padding:4px 14px;border-radius:var(--radius-s);font-size:.73rem;cursor:pointer;
  border:none;background:transparent;color:var(--text-muted);
  transition:all .15s;font-family:inherit;white-space:nowrap;touch-action:manipulation;
}
.file-tab:hover{color:var(--text-normal);background:rgba(255,255,255,0.04)}
.file-tab.active{background:var(--color-accent);color:#fff}

/* Content area */
.content{flex:1;overflow-y:auto;padding:2rem 2.5rem;-webkit-overflow-scrolling:touch}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:var(--border-visible);border-radius:6px}

/* ══════════════════════════════════════════
   MARKDOWN RENDERED — Blue Topaz inspired
   ══════════════════════════════════════════ */
.rendered{max-width:780px;margin:0 auto;line-height:1.75}

.rendered h1{
  font-size:var(--h1-size);font-weight:700;color:var(--text-normal);
  margin:2rem 0 1rem;padding-bottom:.4rem;
  border-bottom:2px solid var(--color-accent);line-height:1.3;
}
.rendered h2{
  font-size:var(--h2-size);font-weight:600;color:var(--text-normal);
  margin:1.8rem 0 .8rem;padding-bottom:.3rem;
  border-bottom:1px solid var(--border-visible);line-height:1.35;
}
.rendered h3{
  font-size:var(--h3-size);font-weight:600;color:var(--text-normal);
  margin:1.5rem 0 .6rem;line-height:1.4;
}
.rendered h4{font-size:var(--h4-size);font-weight:600;color:var(--text-soft);margin:1.2rem 0 .5rem}
.rendered h5,.rendered h6{font-size:1em;font-weight:600;color:var(--text-soft);margin:1rem 0 .4rem}

.rendered p{color:var(--text-normal);line-height:1.8;margin:.7rem 0;font-size:1em}
.rendered strong{color:#e0e0e0;font-weight:700}
.rendered em{color:var(--text-soft)}

.rendered blockquote{
  border-left:3px solid var(--color-accent);margin:1.2rem 0;padding:.7rem 1.1rem;
  background:var(--color-accent-glow);
  border-radius:0 var(--radius-s) var(--radius-s) 0;color:var(--text-soft);
}
.rendered blockquote p{margin:.3rem 0}

.rendered a{color:var(--color-accent-light);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .15s}
.rendered a:hover{border-bottom-color:var(--color-accent-light)}

.rendered code{
  background:var(--bg-code);padding:2px 7px;border-radius:var(--radius-s);
  font-family:var(--font-mono);font-size:.85em;color:#e0b070;
  border:1px solid var(--border-subtle);
}

.rendered pre{
  background:var(--bg-code);border:1px solid var(--border-normal);
  border-radius:var(--radius-m);padding:1rem 1.3rem;overflow-x:auto;
  margin:1.2rem 0;font-size:.88rem;line-height:1.65;
}
.rendered pre code{background:none;padding:0;color:#c6c6d0;border:none;font-size:inherit}

.rendered table{border-collapse:collapse;width:100%;margin:1.2rem 0;font-size:.9em}
.rendered th,.rendered td{border:1px solid var(--border-subtle);padding:.5rem .9rem;text-align:left}
.rendered th{background:var(--color-accent-soft);color:var(--text-normal);font-weight:600}
.rendered tr:hover{background:rgba(255,255,255,0.02)}

.rendered ul,.rendered ol{padding-left:1.6rem;margin:.6rem 0;color:var(--text-normal);line-height:1.9}
.rendered li{margin:.15rem 0}
.rendered li::marker{color:var(--text-faint)}

.rendered hr{border:none;border-top:1px solid var(--border-subtle);margin:2.5rem 0}
.rendered img{max-width:100%;border-radius:var(--radius-s)}
.rendered .mermaid{background:var(--bg-surface);border-radius:var(--radius-m);padding:1rem;margin:1.2rem 0;overflow-x:auto}
.rendered .mermaid svg{max-width:100%}

/* Meta box */
.meta-box{
  background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-m);
  padding:.7rem 1rem;margin-bottom:1.5rem;font-size:.78rem;color:var(--text-muted);
  display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;
}
.meta-box .meta-label{color:var(--text-soft);font-weight:600}

/* Empty state, loading, error */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-muted);text-align:center;padding:2rem}
.empty-state .icon{font-size:3rem;margin-bottom:1rem;opacity:.6}
.empty-state h3{font-size:1.1rem;margin-bottom:.5rem;color:var(--text-soft)}
.empty-state p{font-size:.9rem}
.loader{text-align:center;padding:3rem;color:var(--text-muted)}
.loader .spinner{
  display:inline-block;width:28px;height:28px;border:3px solid var(--border-visible);
  border-top-color:var(--color-accent);border-radius:50%;
  animation:spin .8s linear infinite;margin-bottom:.8rem;
}
@keyframes spin{to{transform:rotate(360deg)}}
.error-banner{
  background:rgba(244,67,54,0.08);border:1px solid rgba(244,67,54,0.2);
  border-radius:var(--radius-s);padding:.7rem 1rem;margin:1rem 0;color:#e57373;font-size:.85rem;
}

.sidebar-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9}

/* ── Mobile ── */
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);z-index:20;width:280px;min-width:280px}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.active{display:block}
  .menu-btn{display:inline-block}
  .content{padding:1.2rem 1rem}
  .rendered h1{font-size:1.35em}
  .rendered h2{font-size:1.2em}
}
@media(max-width:400px){.sidebar{width:100%;min-width:100%}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar-overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="../../" class="back" title="返回门户">←</a>
      <h2>📐 Math5All</h2>
    </div>
    <div class="sidebar-tree" id="tree"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" title="目录">☰</button>
      <span class="lesson-title" id="lessonTitle">选择一节课开始</span>
      <div class="file-tabs" id="fileTabs"></div>
    </div>
    <div class="content" id="content">
      <div class="empty-state">
        <div class="icon" style="font-size:3rem">📐</div>
        <h3>欢迎来到 Math5All</h3>
        <p>从左侧选择一节课开始阅读<br>以数学为脊柱的整合式学习</p>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
/* ══════════════════════════════════════════
   CONFIG
   ══════════════════════════════════════════ */
var CONFIG = {
  repo:'LaFloraison/Math5All',
  branch:'main',
  lessonsDir:'lessons/calculus',
  // Math5All file types
  fileTypes:[
    {id:'数学',label:'数学',icon:'📐'},
    {id:'应用',label:'应用',icon:'🔗'},
    {id:'习题',label:'习题',icon:'✏️'},
    {id:'谜镜',label:'谜镜',icon:'🪞'}
  ]
};

var state = {
  lessons:[],          // [{folderName, displayName, files:[]}]
  currentIdx:-1,
  currentFile:'数学'
};

/* ── DOM ── */
var sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay');
var treeEl=document.getElementById('tree'),contentEl=document.getElementById('content');
var lessonTitle=document.getElementById('lessonTitle'),fileTabs=document.getElementById('fileTabs');
var menuBtn=document.getElementById('menuBtn');

menuBtn.addEventListener('click',function(){sidebar.classList.toggle('open');overlay.classList.toggle('active')});
overlay.addEventListener('click',function(){sidebar.classList.remove('open');overlay.classList.remove('active')});
function closeMenu(){sidebar.classList.remove('open');overlay.classList.remove('active')}

/* ══════════════════════════════════════════
   LOAD LESSONS LIST (via GitHub API)
   ══════════════════════════════════════════ */
function loadLessons(){
  treeEl.innerHTML='<div class="loader"><div class="spinner"></div><p>加载课程列表…</p></div>';

  /* Use GitHub Contents API to list lesson directories */
  var apiUrl='https://api.github.com/repos/'+CONFIG.repo+'/contents/'+CONFIG.lessonsDir+'?ref='+CONFIG.branch;

  fetch(apiUrl,{headers:{'Accept':'application/vnd.github.v3+json'}})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
    .then(function(items){
      /* Filter directories only */
      state.lessons=[];
      for(var i=0;i<items.length;i++){
        if(items[i].type==='dir'){
          state.lessons.push({
            folderName:items[i].name,
            displayName:formatLessonName(items[i].name),
            url:items[i].url
          });
        }
      }
      /* Sort naturally */
      state.lessons.sort(function(a,b){
        return a.folderName.localeCompare(b.folderName,'zh');
      });

      renderTree();
      /* Auto-load first lesson */
      if(state.lessons.length>0){
        selectLesson(0);
      }
    })
    .catch(function(e){
      treeEl.innerHTML='<div class="error-banner">加载课程列表失败: '+e.message+
        '<br><small>GitHub API 限制: 60次/小时 (未认证)。如果超限请稍后再试。</small></div>';
    });
}

/* Parse folder names like "第01节-P1-Associativity-of-Addition" */
function formatLessonName(name){
  var parts=name.split('-');
  if(parts.length>=2){
    var num=parts[0].replace('第','').replace('节','');
    var prop=parts[1]; // e.g. P1
    var title=parts.slice(2).join(' ').replace(/-/g,' ');
    return prop+' · '+title;
  }
  return name.replace(/-/g,' ');
}

/* ══════════════════════════════════════════
   RENDER TREE
   ══════════════════════════════════════════ */
function renderTree(){
  var html='';
  for(var i=0;i<state.lessons.length;i++){
    var l=state.lessons[i];
    var active=i===state.currentIdx?' active':'';
    var num=l.folderName.match(/第(\d+)节/);
    var numStr=num?num[1]:String(i+1);
    html+='<div class="lesson-item'+active+'" data-idx="'+i+'">'+
      '<span class="num">'+numStr+'</span>'+
      '<span class="status">✅</span> '+
      '<span>'+esc(l.displayName)+'</span>'+
    '</div>';
  }
  treeEl.innerHTML=html;

  treeEl.querySelectorAll('.lesson-item').forEach(function(item){
    item.addEventListener('click',function(){
      selectLesson(parseInt(this.dataset.idx));
      closeMenu();
    });
  });
}

/* ══════════════════════════════════════════
   SELECT & LOAD
   ══════════════════════════════════════════ */
function selectLesson(idx){
  state.currentIdx=idx;
  var lesson=state.lessons[idx];

  /* Update active */
  treeEl.querySelectorAll('.lesson-item').forEach(function(el,i){
    el.classList.toggle('active',i===idx);
  });

  lessonTitle.textContent=lesson.displayName;
  renderFileTabs();
  loadFile('数学');
}

function renderFileTabs(){
  var html='';
  for(var i=0;i<CONFIG.fileTypes.length;i++){
    var ft=CONFIG.fileTypes[i];
    var active=ft.id===state.currentFile?' active':'';
    html+='<button class="file-tab'+active+'" data-file="'+ft.id+'">'+ft.icon+' '+ft.label+'</button>';
  }
  fileTabs.innerHTML=html;

  fileTabs.querySelectorAll('.file-tab').forEach(function(btn){
    btn.addEventListener('click',function(){
      loadFile(this.dataset.file);
    });
  });
}

function loadFile(fileId){
  state.currentFile=fileId;
  /* Update tabs */
  fileTabs.querySelectorAll('.file-tab').forEach(function(t){
    t.classList.toggle('active',t.dataset.file===fileId);
  });

  var lesson=state.lessons[state.currentIdx];
  var folderName=encodeURIComponent(lesson.folderName);
  var fileName=encodeURIComponent(fileId+'.md');
  var url='https://raw.githubusercontent.com/'+CONFIG.repo+'/'+CONFIG.branch+'/'+
    CONFIG.lessonsDir+'/'+folderName+'/'+fileName;

  contentEl.innerHTML='<div class="loader"><div class="spinner"></div><p>加载中…</p></div>';

  fetch(url)
    .then(function(r){if(!r.ok)throw new Error('文件不存在 ('+r.status+')');return r.text()})
    .then(function(md){renderMarkdown(md)})
    .catch(function(e){
      contentEl.innerHTML='<div class="empty-state">'+
        '<div class="icon" style="font-size:2.5rem">📝</div>'+
        '<h3>这个文件还没有生成</h3>'+
        '<p>'+fileId+'.md<br>即将生成，敬请期待。</p>'+
        '<p style="font-size:.8rem;margin-top:.5rem;color:var(--text-muted)">'+esc(e.message)+'</p>'+
      '</div>';
    });
}

/* ══════════════════════════════════════════
   RENDER MARKDOWN
   ══════════════════════════════════════════ */
function renderMarkdown(md){
  /* Parse YAML frontmatter */
  var body=md,meta={};
  if(md.indexOf('---')===0){
    var end=md.indexOf('---',3);
    if(end>0){
      var fm=md.substring(3,end).trim();
      body=md.substring(end+3).trim();
      fm.split('\n').forEach(function(line){
        var ci=line.indexOf(':');
        if(ci>0){
          var k=line.substring(0,ci).trim();
          var v=line.substring(ci+1).trim().replace(/^['"]|['"]$/g,'');
          meta[k]=v;
        }
      });
    }
  }

  var metaHtml='';
  if(Object.keys(meta).length>0){
    metaHtml='<div class="meta-box">';
    if(meta.course)metaHtml+='<span class="meta-item"><span class="meta-label">课程</span> '+esc(meta.course)+'</span>';
    if(meta.date)metaHtml+='<span class="meta-item"><span class="meta-label">日期</span> '+esc(meta.date)+'</span>';
    if(meta.prop)metaHtml+='<span class="meta-item"><span class="meta-label">命题</span> '+esc(meta.prop)+'</span>';
    metaHtml+='</div>';
  }

  var html=metaHtml;
  try{
    if(typeof marked!=='undefined'){
      marked.setOptions({breaks:true,gfm:true});
      html+=marked.parse(body);
    }else{
      html+='<div class="error-banner">Markdown 渲染器未加载</div>';
    }
  }catch(e){
    html+='<div class="error-banner">渲染错误: '+esc(e.message)+'</div>';
  }

  contentEl.innerHTML='<div class="rendered">'+html+'</div>';
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* ══════════════════════════════════════════
   KEYBOARD
   ══════════════════════════════════════════ */
document.addEventListener('keydown',function(e){
  if(state.currentIdx<0)return;
  if(e.key==='1')loadFile('数学');
  if(e.key==='2')loadFile('应用');
  if(e.key==='3')loadFile('习题');
  if(e.key==='4')loadFile('谜镜');
  if((e.key==='ArrowRight'||e.key==='ArrowDown')&&state.currentIdx<state.lessons.length-1){
    e.preventDefault();selectLesson(state.currentIdx+1);
  }
  if((e.key==='ArrowLeft'||e.key==='ArrowUp')&&state.currentIdx>0){
    e.preventDefault();selectLesson(state.currentIdx-1);
  }
});

/* ══════════════════════════════════════════
   INIT
   ══════════════════════════════════════════ */
loadLessons();
</script>
</body>
</html>
